<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07100f" />
    <meta name="description" content="BR-Tools — fast, direct access to BlueRock company systems." />
    <title>BR-Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071110'/%3E%3Cpath d='M17 18h19c8 0 13 4 13 10 0 4-2 7-6 8 5 1 8 5 8 9 0 7-6 11-15 11H17V18Zm10 8v7h8c3 0 5-1 5-4s-2-3-5-3h-8Zm0 14v8h9c4 0 6-1 6-4s-2-4-6-4h-9Z' fill='%238eff6b'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="BR-Tools home">
          <span class="brand-symbol" aria-hidden="true">BR</span>
          <span class="brand-copy"><strong>BR-Tools</strong><small>Company workspace</small></span>
        </a>
        <div class="connection-status" aria-label="Two systems connected">
          <span class="pulse" aria-hidden="true"></span><span>2 systems connected</span>
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <div class="hero-copy">
            <p class="kicker"><span>01</span> DIGITAL WORKSPACE</p>
            <h1 id="page-title">Your work.<br /><em>One launch away.</em></h1>
          </div>
          <div class="hero-note">
            <span class="note-line" aria-hidden="true"></span>
            <p>Select a workspace to continue. Every link takes you directly to the system you need.</p>
          </div>
        </section>

        <section class="systems" aria-labelledby="systems-title">
          <div class="section-label">
            <h2 id="systems-title">Available systems</h2><span>Choose your destination</span>
          </div>
          <div class="system-grid" id="system-grid"></div>
        </section>
      </main>

      <footer>
        <p>BlueRock digital workspace</p>
        <p><span class="footer-mark" aria-hidden="true"></span> 2 systems ready</p>
      </footer>
    </div>

    <script src="tools.js"></script>
    <script>
      const grid = document.querySelector("#system-grid");

      BR_TOOLS.forEach((tool, index) => {
        const isEnabled = tool.enabled !== false;
        const card = document.createElement(isEnabled ? "a" : "article");
        card.className = `system-card${isEnabled ? "" : " is-disabled"}`;
        if (isEnabled) {
          card.href = tool.url;
          card.setAttribute("aria-label", `Open ${tool.name}`);
        } else {
          card.setAttribute("aria-label", `${tool.name} is temporarily unavailable`);
          card.setAttribute("aria-disabled", "true");
        }
        card.style.setProperty("--accent", tool.accent);
        card.style.setProperty("--glow", tool.glow);
        card.style.setProperty("--delay", `${index * 90}ms`);
        card.innerHTML = `
          <div class="card-head"><span class="card-number">0${index + 1}</span><span class="card-category">${tool.category}</span></div>
          <div class="app-icon"><img src="${tool.favicon}" alt="" /><span class="icon-fallback" hidden>${tool.fallback}</span></div>
          <div class="card-content"><h3>${tool.name}</h3><p>${tool.description}</p></div>
          <div class="card-action" aria-hidden="true">
            <span>${isEnabled ? "Open workspace" : "Available soon"}</span>
            ${isEnabled
              ? `<span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5" /></svg></span>`
              : `<span class="status-badge">Paused</span>`}
          </div>`;

        const icon = card.querySelector("img");
        const fallback = card.querySelector(".icon-fallback");
        icon.addEventListener("error", () => {
          icon.hidden = true;
          fallback.hidden = false;
        });
        grid.appendChild(card);
      });
    </script>
  </body>
</html>
